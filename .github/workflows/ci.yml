name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Python version is read from the repo-managed version file (apps/api/.python-version).

jobs:
  # ── Job 1: Backend API — lint, typecheck, full pytest suite ────────────────
  # Runs fully in parallel with the Web job. Tests use the in-memory Mongo backend
  # (apps/api/tests/conftest.py) + disabled rate limiter, so no external services
  # are required for a green run.
  api:
    name: API — Lint, TypeCheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      # NOTE: ruff (716 findings) and mypy (130 errors) are NOT clean at the
      # repo baseline (no ruff/mypy config committed, codebase carries legacy
      # debt). They are kept as non-blocking *reporting* steps so findings stay
      # visible without permanently red-lighting CI. Backend owner (AI-A) may
      # re-enable them as required once the debt is paid down. The required
      # backend gate is the pytest suite below.
      - name: Run ruff lint (report only)
        continue-on-error: true
        run: ruff check .

      - name: Run mypy typecheck (report only)
        continue-on-error: true
        run: mypy app

      # Coverage gate (Phase 7 NV3): measured 52% line coverage locally on
      # 2026-08-02 (205 tests). Threshold 45% = measured − 7pp, so the gate
      # blocks large coverage regressions without red-lighting the suite while
      # new instrumented code (request-id, retention, snapshot tasks) adds
      # untested lines. Raise the floor as coverage grows.
      - name: Run pytest suite (in-memory DB, no external services)
        env:
          MONGODB_URI: memory://test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-for-ci
          FRONTEND_URL: http://localhost:3000
        run: pytest tests/ -q --cov=app --cov-report=xml --cov-report=term --cov-fail-under=45 -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/api/coverage.xml
          flags: backend

  # ── Lint regression gate (Phase 7 NV3) ─────────────────────────────────────
  # ruff/mypy stay report-only in the `api` job (baseline is not clean). This
  # job turns them into a regression gate: it fails when the error count goes
  # UP versus the committed baselines (devops/ci/{ruff,mypy}.count). Fixing
  # findings is fine and encouraged — update the baseline files on purpose.
  lint-regression:
    name: Lint Regression (ruff/mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install ruff mypy

      - name: Run lint regression report
        run: bash devops/scripts/ci-lint-report.sh

  # ── Job 2: Frontend Web — lint, typecheck, build & unit tests ──────────────
  # Builds are fully independent of a running API: Next.js rewrites proxy at
  # request-time only (no build-time API fetch) and generated API types are
  # committed (apps/web/types/api.ts), so no Python/API dependency is required.
  web:
    name: Web — Lint, TypeCheck, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build Next.js app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Run unit tests
        run: npm test -- --ci

      - name: Run accessibility tests
        run: npm run test:a11y -- --ci

  # ── Migration check on a clean DB (in-memory backend) ──────────────────────
  # Runs the documented migration runner (apps/api/migrations/README.md) against
  # a clean in-memory Mongo DB, verifies migrations actually executed, and
  # re-runs 001 to prove idempotency. Fails fast if the runner can't locate
  # migrations or a migration crashes.
  migration-check:
    name: Migration Check (clean DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version
          cache: 'pip'
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Run migration check
        run: bash devops/scripts/ci-migration-check.sh

  # ── Docker build verification (context = repo root; infra lives in devops/) ─
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image (api stage)
        run: docker build -f devops/docker/Dockerfile.api --target api -t ascendly-api:test .

      - name: Build Web Docker image
        run: docker build -f devops/docker/Dockerfile.web -t ascendly-web:test .

  # ── Security scanning ───────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ── Manifest verification: Helm lint + template + offline k8s validation ──
  # Runs in parallel with api/web. Installs helm, lints and renders all 3 charts
  # (dev values), and validates devops/k8s/* offline with kubeconform.
  manifest-check:
    name: Manifest Check (Helm + K8s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint (all charts)
        run: |
          set -e
          for chart in platform-base ascendly-api ascendly-runtime; do
            echo "== helm lint $chart =="
            helm lint "devops/helm/$chart" -f "devops/helm/$chart/values-dev.yaml"
          done

      - name: Helm template (dev values)
        run: |
          set -e
          helm template platform-base-dev devops/helm/platform-base -f devops/helm/platform-base/values-dev.yaml --dry-run >/dev/null
          helm template ascendly-api-dev devops/helm/ascendly-api -f devops/helm/ascendly-api/values-dev.yaml --dry-run >/dev/null
          helm template ascendly-runtime-dev devops/helm/ascendly-runtime -f devops/helm/ascendly-runtime/values-dev.yaml --dry-run >/dev/null
          echo "Helm template OK (3 charts, dev values)"

      - name: K8s manifest validation (kubeconform, offline)
        run: |
          set -e
          # `kubectl apply --dry-run=client` requires a live cluster API for
          # schema discovery, so it cannot validate offline. kubeconform
          # validates against pinned kubernetes-json-schema without a cluster.
          curl -fsSL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tgz -C /tmp
          # KEDA ScaledObject is a CRD not present in upstream schemas; it is
          # skipped via --ignore-missing-schemas and its YAML is still parsed.
          /tmp/kubeconform -strict -kubernetes-version 1.30.0 -ignore-missing-schemas devops/k8s/

      - name: Helm rendered manifest validation (kubeconform)
        run: |
          set -e
          # Render each chart and validate the OUTPUT too — catches bugs that
          # live in templates (e.g. invalid fields) which helm lint misses.
          for chart in platform-base ascendly-api ascendly-runtime; do
            echo "== kubeconform $chart (rendered) =="
            helm template "$chart-dev" "devops/helm/$chart" -f "devops/helm/$chart/values-dev.yaml" 2>/dev/null \
              | /tmp/kubeconform -strict -kubernetes-version 1.30.0 -ignore-missing-schemas
          done

      - name: Validate Grafana dashboard JSON + alert rules
        run: |
          set -e
          python3 - <<'PY'
          import json, glob
          for f in glob.glob("devops/docker/grafana/dashboards/*.json"):
              d = json.load(open(f))
              assert isinstance(d, dict) and "panels" in d, f"{f}: missing panels"
              for p in d["panels"]:
                  assert "title" in p and "gridPos" in p, f"{f}: malformed panel {p}"
              print(f"OK dashboard {f} ({len(d['panels'])} panels)")
          PY

  # ── Release pipeline dry-run (Phase 8 NV3/NV7) ─────────────────────────────
  # Validates the release tooling without a cluster or secrets: YAML parse of
  # every manifest/workflow, bash -n on all devops scripts, deploy.sh /
  # rollback.sh --dry-run, SOPS artifacts, and helm template with the same
  # --set overrides the release pipeline uses (image.tag / imagePullSecrets).
  release-dry-run:
    name: Release Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Setup Python (from .python-version)
        uses: actions/setup-python@v5
        with:
          python-version-file: apps/api/.python-version

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run release dry-run validation
        run: bash devops/scripts/ci-release-dry-run.sh

  # ── Common gate: merge is allowed only when ALL required jobs are green ────
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [api, web, migration-check, docker-build, security-scan, manifest-check, lint-regression, release-dry-run]
    if: always()
    steps:
      - name: Summary
        run: |
          FAILED=0
          for job in api web migration-check docker-build security-scan manifest-check lint-regression release-dry-run; do
            result="${{ needs[format('{0}', job)].result }}"
            echo "::notice::$job → $result"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED=1
            fi
          done
          echo "## 📋 Ascendly CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | ${{ needs.api.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web | ${{ needs.web.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Migration Check | ${{ needs.migration-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint Regression | ${{ needs.lint-regression.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Build | ${{ needs.docker-build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest Check | ${{ needs.manifest-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Dry-Run | ${{ needs.release-dry-run.result }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more required CI jobs failed."
            exit 1
          fi