name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-frontend-preview:
    name: Deploy Frontend to Vercel Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Generate API types
        run: npm run generate:api
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--preview'
          working-directory: ./apps/web

      - name: Extract Preview URL
        id: vercel
        run: |
          echo "preview_url=${{ steps.deploy.outputs.preview-url }}" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel.outputs.preview_url }}';
            if (url) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Frontend Preview Deployed**\n\n🔗 [Preview URL](${url})\n\nThis preview will update on every push to this PR.`
              });
            }

  deploy-backend-preview:
    name: Deploy Backend Preview (Railway/Render)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway Preview
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          npm install -g @railway/cli
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway up --environment=pr-${{ github.event.number }} --service=api
          railway environment pr-${{ github.event.number }} --service=api domain

      - name: Comment Backend Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Backend Preview Deployed**\n\nEnvironment: \`pr-${{ github.event.number }}\`\n\nUse this environment variable in frontend preview:\n\`NEXT_PUBLIC_API_URL=https://pr-${{ github.event.number }}.railway.app\``
            });

  run-e2e-tests:
    name: Run E2E Tests on Preview
    runs-on: ubuntu-latest
    needs: [deploy-frontend-preview, deploy-backend-preview]
    if: always() && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./apps/web

      - name: Run E2E Tests
        run: npx playwright test --config=apps/web/playwright.config.ts
        working-directory: ./apps/web
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-frontend-preview.outputs.preview_url || 'http://localhost:3000' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  lighthouse-ci:
    name: Lighthouse CI Performance Check
    runs-on: ubuntu-latest
    needs: deploy-frontend-preview
    if: always() && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ needs.deploy-frontend-preview.outputs.preview_url }}/
            ${{ needs.deploy-frontend-preview.outputs.preview_url }}/courses
            ${{ needs.deploy-frontend-preview.outputs.preview_url }}/pricing
          budgetPath: ./apps/web/lighthouse-budget.json
          uploadArtifacts: true

  visual-regression:
    name: Visual Regression (Chromatic/Percy)
    runs-on: ubuntu-latest
    needs: deploy-frontend-preview
    if: always() && github.event.pull_request.draft == false && secrets.CHROMATIC_PROJECT_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: ./apps/web

      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitOnceUploaded: true

  summary:
    name: Preview Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend-preview, deploy-backend-preview, run-e2e-tests, lighthouse-ci, visual-regression]
    if: always()
    steps:
      - name: Create Deployment Summary
        run: |
          echo "## 📋 Preview Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Preview | ${{ needs.deploy-frontend-preview.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Preview | ${{ needs.deploy-backend-preview.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.run-e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse CI | ${{ needs.lighthouse-ci.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Visual Regression | ${{ needs.visual-regression.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Preview:** ${{ needs.deploy-frontend-preview.outputs.preview_url }}" >> $GITHUB_STEP_SUMMARY