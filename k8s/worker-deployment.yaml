apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascendly-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ascendly-worker
  template:
    metadata:
      labels:
        app: ascendly-worker
    spec:
      containers:
        - name: worker
          image: ascendly-worker:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - secretRef:
                name: ascendly-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ascendly-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ascendly-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70