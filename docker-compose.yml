services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=ascendly-dev-master-key
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data

  # Local email catcher (dev): SMTP 1025 / web UI 8025.
  # Accepts ANY username/password — the non-empty dummy creds below are what
  # makes backend email.py leave its `[DEV EMAIL]` print-fallback and actually
  # deliver via SMTP so you can inspect messages in the UI.
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025
    volumes:
      - mailpit_data:/data

  api:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.api
      target: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ascendly
      - REDIS_URL=redis://redis:6379/0
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=ascendly-dev-master-key
      # LLM providers (empty = fallback/disabled); see .env.example
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Email (dev → Mailpit). Dummy non-empty creds are required: email.py
      # treats empty SMTP_USER/PASSWORD as "no SMTP configured" and only prints
      # [DEV EMAIL]; Mailpit accepts any credentials.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-mailpit}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-mailpit}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.api
      target: worker
    restart: unless-stopped
    ports:
      - "9101:9101"   # Prometheus /metrics (worker process)
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ascendly
      - REDIS_URL=redis://redis:6379/0
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=ascendly-dev-master-key
      - PROCESS_MODE=worker
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9101}
      # LLM providers (empty = fallback/disabled); see .env.example
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Email (dev → Mailpit) — dummy creds, see api service comment
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-mailpit}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-mailpit}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/app
    command: python -m app.runtime

  cron:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.api
      target: cron
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ascendly
      - REDIS_URL=redis://redis:6379/0
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=ascendly-dev-master-key
      - PROCESS_MODE=cron
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9101}
      # LLM providers (empty = fallback/disabled); see .env.example
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Email (dev → Mailpit) — dummy creds, see api service comment
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-mailpit}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-mailpit}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/app
    command: python -m app.runtime

  web:
    build:
      context: .
      dockerfile: devops/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./devops/docker/prometheus:/etc/prometheus/prometheus
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./devops/docker/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  mongo_data:
  meili_data:
  prometheus_data:
  grafana_data:
  mailpit_data:
