groups:
  - name: ascendly-api
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 2s"
          description: "p95 latency is {{ $value }}s over the last 5 minutes"

      - alert: High4xxRate
        expr: rate(http_requests_total{status=~"4.."}[5m]) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "4xx rate > 20%"
          description: "4xx rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: WorkerQueueGrowing
        expr: worker_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker queue depth > 100"
          description: "Queue depth is {{ $value }} — jobs may be failing or workers are saturated"

      - alert: DeadLetterQueueNonEmpty
        expr: worker_dlq_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue has messages"
          description: "DLQ has {{ $value }} messages — investigate failed jobs"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Instance has been unreachable for over 1 minute"

      # ── LLM / AI support chat ─────────────────────────────────────────────
      # Metrics are exposed by the backend (app/core/telemetry.py) once AI-A
      # wires call_llm_stream: llm_requests_total{status="ok"|"error"},
      # llm_tokens_total{provider}, llm_cost_total_usd{provider}.
      # Until then these rules evaluate on empty series (no fires).
      - alert: LLMHighErrorRate
        expr: |
          sum(rate(llm_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(llm_requests_total[5m])), 1)
          > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate > 20%"
          description: "LLM request error rate is {{ $value | humanizePercentage }} over the last 5 minutes — provider outage or key/rate-limit issues."

      - alert: LLMSpikeInRequests
        expr: rate(llm_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM request rate > 100 req/5m"
          description: "LLM request rate is {{ $value | humanize }} req/s over 5m — possible runaway retry loop or abuse."

      - alert: LLMCostSpike
        expr: increase(llm_cost_total_usd[1h]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost spike > $10/h"
          description: "LLM spend increased by ${{ $value }} in the last hour — investigate abnormal usage."
