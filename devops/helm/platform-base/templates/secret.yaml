apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    sealedsecrets.bitnami.com/placeholder: "true"
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secretData.JWT_SECRET | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secretData.R2_ACCESS_KEY_ID | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secretData.R2_SECRET_ACCESS_KEY | quote }}
  # LLM provider keys (empty = provider disabled/fallback). Set via values
  # (--set secretData.OPENAI_API_KEY=...) or an external secrets tool — never
  # commit real keys.
  OPENAI_API_KEY: {{ .Values.secretData.OPENAI_API_KEY | quote }}
  OPENROUTER_API_KEY: {{ .Values.secretData.OPENROUTER_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.secretData.GEMINI_API_KEY | quote }}
  TAVILY_API_KEY: {{ .Values.secretData.TAVILY_API_KEY | quote }}
