namespace: ascendly
image:
  repository: ascendly-api
  tag: latest
  pullPolicy: IfNotPresent
serviceAccountName: ascendly-platform
configMapRef: ascendly-config
secretRef: ascendly-secrets
worker:
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    minReplicas: 1
    maxReplicas: 20
cron:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
keda:
  enabled: true
  redisAddress: redis.internal:6379
  queueName: "arq:queue:default"
  queueLength: 20
  pollingInterval: 30
  cooldown: 300
  fallback:
    threshold: 3
    replicas: 5
  advanced:
    scaleUpStabilizationSeconds: 60
    scaleUpPercent: 100
    scaleDownStabilizationSeconds: 300
    scaleDownPercent: 50
