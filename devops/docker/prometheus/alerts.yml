groups:
  - name: ascendly-api
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5%"
          description: "Error rate for {{ $labels.method }} {{ $labels.path }} is {{ $value | humanizePercentage }} over 5m."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 2s"
          description: "p95 latency for {{ $labels.method }} {{ $labels.path }} is {{ $value }}s over 5m."

      - alert: WorkerQueueGrowing
        expr: worker_queue_depth > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Worker queue depth > 50"
          description: "Worker queue depth is {{ $value }} — jobs may be backing up."

      - alert: WorkerDLQNonEmpty
        expr: worker_dlq_count > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Dead-letter queue is not empty"
          description: "{{ $value }} jobs in dead-letter queue — investigate worker failures."

      # ── LLM / AI support chat ─────────────────────────────────────────────
      # Metric contract (backend, exported via /metrics):
      #   llm_requests_total{provider,status="ok"|"error"}
      #   llm_tokens_total{provider}
      #   llm_cost_usd_total{provider}
      # Empty series → no fires until the backend exports them.
      - alert: LLMHighErrorRate
        expr: |
          sum(rate(llm_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(llm_requests_total[5m])), 1)
          > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate > 20%"
          description: "LLM request error rate is {{ $value | humanizePercentage }} over the last 5 minutes — provider outage or key/rate-limit issues."

      - alert: LLMSpikeInRequests
        expr: rate(llm_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM request rate > 100 req/5m"
          description: "LLM request rate is {{ $value | humanize }} req/s over 5m — possible runaway retry loop or abuse."

      - alert: LLMCostSpike
        expr: increase(llm_cost_usd_total[1h]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost spike > $10/h"
          description: "LLM spend increased by ${{ $value }} in the last hour — investigate abnormal usage."

      # ── Proactive support job ─────────────────────────────────────────────
      # Fires when run_proactive_support_checks finishes in error. The metric
      # worker_jobs_completed_total{task,status} exists in app/core/telemetry.py;
      # for this to fire the backend must wire the arq on_job_complete/on_job_failed
      # hooks and expose the counter on a scraped /metrics endpoint (or export
      # proactive_checks_total{status} instead — then update this expr accordingly).
      # Empty series → no fires until then.
      - alert: ProactiveCheckJobFailed
        expr: |
          sum(increase(worker_jobs_completed_total{task="run_proactive_support_checks",status="error"}[1h]))
          > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proactive support check job failed"
          description: "run_proactive_support_checks reported {{ $value }} failed run(s) in the last hour — check worker/cron logs and DLQ."
