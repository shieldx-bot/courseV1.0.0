global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "prometheus/alerts.yml"

scrape_configs:
  - job_name: "ascendly-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "ascendly-worker"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    metrics_relabel_configs:
      - source_labels: [__name__]
        regex: "worker_.*"
        action: keep