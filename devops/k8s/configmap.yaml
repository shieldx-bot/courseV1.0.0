apiVersion: v1
kind: ConfigMap
metadata:
  name: ascendly-config
  namespace: ascendly
  labels:
    app.kubernetes.io/part-of: ascendly
data:
  # Shared, non-secret runtime configuration (12-Factor)
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  FRONTEND_URL: "https://ascendly.io"
  API_BASE_URL: "https://ascendly.io/api"
  # Stateful backends stay external (management requirement)
  MONGODB_URI: "mongodb://mongo.internal:27017/ascendly"
  REDIS_URL: "redis://redis.internal:6379/0"
  MEILI_URL: "http://meilisearch.internal:7700"
  MEILI_MASTER_KEY: ""  # supplied via Secret when real