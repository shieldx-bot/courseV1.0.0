# Real secrets: kubectl -n ascendly create secret generic ascendly-secrets --from-literal=...
# Placeholder to be replaced later by SealedSecret (controller.mintel.com sealed-secrets.bitnami.com/sealed=true)
# or SOPS annotation (kustomize.config.k8s.io/needs-hash) — no Vault/External Secrets at this stage.
apiVersion: v1
kind: Secret
metadata:
  name: ascendly-secrets
  namespace: ascendly
  annotations:
    sealedsecrets.bitnami.com/placeholder: "true"
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_CLUSTER"
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  # LLM provider keys (empty = provider disabled/fallback).
  # Create/update without committing values:
  #   kubectl -n ascendly create secret generic ascendly-secrets \
  #     --from-literal=OPENAI_API_KEY=... \
  #     --from-literal=OPENROUTER_API_KEY=... \
  #     --from-literal=GEMINI_API_KEY=... \
  #     --from-literal=TAVILY_API_KEY=... \
  #     --dry-run=client -o yaml | kubectl apply -f -
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GEMINI_API_KEY: ""
  TAVILY_API_KEY: ""
