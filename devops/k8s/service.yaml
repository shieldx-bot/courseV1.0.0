apiVersion: v1
kind: Service
metadata:
  name: ascendly-api
  namespace: ascendly
spec:
  type: ClusterIP
  selector:
    app: ascendly-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ascendly-web
  namespace: ascendly
spec:
  type: ClusterIP
  selector:
    app: ascendly-web
  ports:
    - port: 3000
      targetPort: 3000
---
# Worker process Prometheus /metrics (worker/cron runtime bind 0.0.0.0:9101
# via prometheus_client start_http_server when telemetry is enabled).
apiVersion: v1
kind: Service
metadata:
  name: ascendly-worker-metrics
  namespace: ascendly
  labels:
    app.kubernetes.io/name: ascendly
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    app: ascendly-worker
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
---
apiVersion: v1
kind: Service
metadata:
  name: ascendly-cron-metrics
  namespace: ascendly
  labels:
    app.kubernetes.io/name: ascendly
    app.kubernetes.io/component: cron
spec:
  type: ClusterIP
  selector:
    app: ascendly-cron
  ports:
    - name: metrics
      port: 9101
      targetPort: 9101
