apiVersion: v1
kind: Service
metadata:
  name: ascendly-api
  namespace: ascendly
spec:
  type: ClusterIP
  selector:
    app: ascendly-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ascendly-web
  namespace: ascendly
spec:
  type: ClusterIP
  selector:
    app: ascendly-web
  ports:
    - port: 3000
      targetPort: 3000
