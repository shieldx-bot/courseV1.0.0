apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ascendly
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: ascendly
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
# web -> api (internal, port 8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
  namespace: ascendly
spec:
  podSelector:
    matchLabels:
      app: ascendly-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ascendly-web
      ports:
        - port: 8000
---
# Ingress controller (kube-system) -> api:8000 + web:3000
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: ascendly
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["ascendly-api", "ascendly-web"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8000
        - port: 3000
---
# API egress: DNS + external data/AI/R2/SMTP (port-scoped; see docs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api
  namespace: ascendly
spec:
  podSelector:
    matchLabels:
      app: ascendly-api
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 27017  # Mongo
        - protocol: TCP
          port: 6379   # Redis
        - protocol: TCP
          port: 7700   # Meilisearch
        - protocol: TCP
          port: 443    # HTTPS (LLM/R2)
        - protocol: TCP
          port: 587    # SMTP
---
# Worker egress: DNS + queue + data (Mongo/Redis/Meili/HTTPS)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-worker
  namespace: ascendly
spec:
  podSelector:
    matchLabels:
      app: ascendly-worker
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 7700
        - protocol: TCP
          port: 443
---
# Cron egress: DNS + Redis + Mongo (+ HTTPS for analytics LLM)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-cron
  namespace: ascendly
spec:
  podSelector:
    matchLabels:
      app: ascendly-cron
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 7700
        - protocol: TCP
          port: 443
---
# ── Prometheus -> worker/cron metrics (port 9101) ────────────────────────────
# INGRESS side (default-deny-ingress applies to every pod): allow the
# Prometheus pod to scrape worker/cron /metrics. Sources: a Prometheus in the
# `monitoring` namespace (kube-prometheus-stack default) OR a same-namespace
# pod labelled app=prometheus (self-hosted).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-metrics-ingress
  namespace: ascendly
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["ascendly-worker", "ascendly-cron"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9101
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9101
---
# EGRESS side: if Prometheus itself runs in the ascendly namespace
# (default-deny-egress applies), let it reach worker/cron :9101 + DNS.
# A Prometheus in another namespace (e.g. monitoring) is governed by that
# namespace's policies — this rule is inert there by design.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-prometheus
  namespace: ascendly
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["ascendly-worker", "ascendly-cron"]
      ports:
        - port: 9101
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
