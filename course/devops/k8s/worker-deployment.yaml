apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascendly-worker
  namespace: ascendly
  labels:
    app: ascendly-worker
    app.kubernetes.io/name: ascendly
    app.kubernetes.io/instance: ascendly-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ascendly
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ascendly-worker
  template:
    metadata:
      labels:
        app: ascendly-worker
        app.kubernetes.io/name: ascendly
        app.kubernetes.io/instance: ascendly-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: ascendly
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: ascendly-platform
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ascendly-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PROCESS_MODE
              value: "worker"
          envFrom:
            - configMapRef:
                name: ascendly-config
            - secretRef:
                name: ascendly-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 2"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: error-logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: error-logs
          emptyDir: {}
