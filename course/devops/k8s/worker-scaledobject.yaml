apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ascendly-worker-scaledobject
  namespace: ascendly
spec:
  scaleTargetRef:
    name: ascendly-worker
    kind: Deployment
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 20
  fallback:
    failureThreshold: 3
    replicas: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
  triggers:
    - type: redis
      metadata:
        address: redis.internal:6379
        listName: arq:queue:default
        listLength: "20"
