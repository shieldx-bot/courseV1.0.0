apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascendly-api
  namespace: ascendly
  labels:
    app: ascendly-api
    # Standard Kubernetes recommended labels (operations conventions)
    app.kubernetes.io/name: ascendly
    app.kubernetes.io/instance: ascendly-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ascendly
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ascendly-api
  template:
    metadata:
      labels:
        app: ascendly-api
        app.kubernetes.io/name: ascendly
        app.kubernetes.io/instance: ascendly-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ascendly
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: ascendly-platform
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ascendly-api
      containers:
        - name: api
          image: ascendly-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PROCESS_MODE
              value: "api"
          envFrom:
            - configMapRef:
                name: ascendly-config
            - secretRef:
                name: ascendly-secrets
          ports:
            - containerPort: 8000
          # Drain traffic before SIGTERM (readiness flips during termination)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: error-logs
              mountPath: /app/logs
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: error-logs
          emptyDir: {}
