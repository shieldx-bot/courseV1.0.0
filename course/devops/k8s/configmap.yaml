apiVersion: v1
kind: ConfigMap
metadata:
  name: ascendly-config
  namespace: ascendly
  labels:
    app.kubernetes.io/part-of: ascendly
data:
  # Shared, non-secret runtime configuration (12-Factor)
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  FRONTEND_URL: "https://ascendly.io"
  API_BASE_URL: "https://ascendly.io/api"
  # Stateful backends stay external (management requirement)
  MONGODB_URI: "mongodb://mongo.internal:27017/ascendly"
  REDIS_URL: "redis://redis.internal:6379/0"
  MEILI_URL: "http://meilisearch.internal:7700"
  MEILI_MASTER_KEY: ""  # supplied via Secret when real
  # LLM providers — non-secret defaults (keys come from Secret):
  # Empty values let the backend fall back to its compiled defaults.
  OPENAI_BASE_URL: "https://api.groq.com/openai/v1"
  OPENAI_MODEL: "llama-3.3-70b-versatile"
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  OPENROUTER_MODEL: "nvidia/nemotron-3-super-120b-a12b:free"