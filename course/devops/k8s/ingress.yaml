apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ascendly-ingress
  namespace: ascendly
  annotations:
    # SSE (POST /api/support/chat/stream, text/event-stream): nginx-ingress
    # must not buffer the stream or hold it beyond the read timeout. Applied at
    # the ingress level (web static + api); buffering off is safe for both.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  rules:
    - host: ascendly.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ascendly-web
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ascendly-api
                port:
                  number: 8000
