# ── ascendly-secrets — SOPS-managed (Phase 8 NV5) ─────────────────────────────
# This file is a dev-only placeholder so `kubectl apply -f devops/k8s/` works
# out of the box. Real secrets are encrypted with SOPS + age and committed as
# devops/secrets/secrets.<env>.enc.yaml (age pubkey: devops/secrets/age.pubkey.txt).
#
#   # Encrypt real values (local, private key in ~/.config/sops/age/keys.txt):
#   cp devops/secrets/secrets.staging.plain.yaml devops/secrets/secrets.staging.plain.yaml
#   # ...fill values... then:
#   bash devops/scripts/secrets-encrypt.sh staging
#
# The release pipeline (devops/scripts/deploy.sh ← release.yml) decrypts the
# per-environment .enc.yaml with the AGE_SECRET_KEY GitHub secret and applies
# it AFTER the helm release, so the real values win over this placeholder.
# Never put real values in this file.
apiVersion: v1
kind: Secret
metadata:
  name: ascendly-secrets
  namespace: ascendly
  annotations:
    sops: "true"
    note: "Real values come from devops/secrets/secrets.production.enc.yaml (SOPS+age)."
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_DEV_ONLY"
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GEMINI_API_KEY: ""
  TAVILY_API_KEY: ""
