namespace: ascendly
image:
  repository: ascendly-api
  tag: latest
  pullPolicy: IfNotPresent
# Optional k8s imagePullSecrets (e.g. `regcred` for a private registry like
# GHCR). The release pipeline (deploy.sh) injects them via --set
# imagePullSecrets[0].name=regcred when REGISTRY_* credentials are provided.
imagePullSecrets: []
replicas: 2
serviceAccountName: ascendly-platform
configMapRef: ascendly-config
secretRef: ascendly-secrets
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuTarget: 70
  memoryTarget: 80
  scaleUpStabilizationSeconds: 60
  scaleUpPercent: 100
  scaleUpMaxPods: 4
  scaleDownStabilizationSeconds: 300
  scaleDownPercent: 50
ingress:
  enabled: true
  host: ascendly.io
  # SSE support for /api/support/chat/stream (text/event-stream):
  # nginx-ingress must not buffer or hold the connection open. proxy-read-timeout
  # is set to 120s so a single LLM streamed response can run to completion
  # without being cut off, while still bounded (not infinite).
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"
