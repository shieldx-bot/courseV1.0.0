apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascendly-cron
  namespace: {{ .Values.namespace }}
  labels:
    app: ascendly-cron
    app.kubernetes.io/instance: ascendly-cron
    app.kubernetes.io/component: cron
    {{- include "ascendly-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cron.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ascendly-cron
  template:
    metadata:
      labels:
        app: ascendly-cron
        app.kubernetes.io/instance: ascendly-cron
        app.kubernetes.io/component: cron
        {{- include "ascendly-runtime.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cron
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROCESS_MODE
              value: "cron"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapRef }}
            - secretRef:
                name: {{ .Values.secretRef }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: error-logs
              mountPath: /app/logs
          resources:
            {{- toYaml .Values.cron.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: error-logs
          emptyDir: {}
