apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Values.namespace }}
  annotations:
    # Phase 8 (NV5): real values are managed via SOPS + age in
    # devops/secrets/secrets.<env>.enc.yaml and applied by deploy.sh AFTER this
    # helm release — that apply overwrites this placeholder secret. Never put
    # real values in values files (they are committed).
    sops: "true"
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secretData.JWT_SECRET | quote }}
  R2_ACCESS_KEY_ID: {{ .Values.secretData.R2_ACCESS_KEY_ID | quote }}
  R2_SECRET_ACCESS_KEY: {{ .Values.secretData.R2_SECRET_ACCESS_KEY | quote }}
  # LLM provider keys (empty = provider disabled/fallback). Set via SOPS
  # (devops/secrets/) or --set secretData.OPENAI_API_KEY=... — never commit
  # real keys.
  OPENAI_API_KEY: {{ .Values.secretData.OPENAI_API_KEY | quote }}
  OPENROUTER_API_KEY: {{ .Values.secretData.OPENROUTER_API_KEY | quote }}
  GEMINI_API_KEY: {{ .Values.secretData.GEMINI_API_KEY | quote }}
  TAVILY_API_KEY: {{ .Values.secretData.TAVILY_API_KEY | quote }}
