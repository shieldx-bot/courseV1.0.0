groups:
  - name: ascendly-api
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatency
        expr: histogram_quantile(0.95, http_request_duration_seconds_bucket) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency > 2s"
          description: "p95 latency is {{ $value }}s over the last 5 minutes"

      - alert: High4xxRate
        expr: rate(http_requests_total{status=~"4.."}[5m]) > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "4xx rate > 20%"
          description: "4xx rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: WorkerQueueGrowing
        expr: worker_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Worker queue depth > 100"
          description: "Queue depth is {{ $value }} — jobs may be failing or workers are saturated"

      - alert: DeadLetterQueueNonEmpty
        expr: worker_dlq_count > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Dead letter queue has messages"
          description: "DLQ has {{ $value }} messages — investigate failed jobs"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "Instance has been unreachable for over 1 minute"

      # ── LLM / AI support chat ─────────────────────────────────────────────
      # Metric contract (backend, exported via /metrics):
      #   llm_requests_total{provider,status="ok"|"error"}
      #   llm_tokens_total{provider}
      #   llm_cost_usd_total{provider}
      # Until the backend exports them these rules evaluate on empty series
      # (no fires).
      - alert: LLMHighErrorRate
        expr: |
          sum(rate(llm_requests_total{status="error"}[5m]))
            / clamp_min(sum(rate(llm_requests_total[5m])), 1)
          > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM error rate > 20%"
          description: "LLM request error rate is {{ $value | humanizePercentage }} over the last 5 minutes — provider outage or key/rate-limit issues."

      - alert: LLMSpikeInRequests
        expr: rate(llm_requests_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM request rate > 100 req/5m"
          description: "LLM request rate is {{ $value | humanize }} req/s over 5m — possible runaway retry loop or abuse."

      - alert: LLMCostSpike
        expr: increase(llm_cost_usd_total[1h]) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost spike > $10/h"
          description: "LLM spend increased by ${{ $value }} in the last hour — investigate abnormal usage."

      # ── Proactive support job ─────────────────────────────────────────────
      # Fires when run_proactive_support_checks fails. The metric
      # worker_jobs_completed_total{task,status} exists in app/core/telemetry.py;
      # the arq on_job_failed hook increments {status="failed"} (see
      # app/core/worker.py::on_job_failed), so this rule matches the code's
      # actual status label. Exposed on the worker/cron /metrics endpoint.
      - alert: ProactiveCheckJobFailed
        expr: |
          sum(increase(worker_jobs_completed_total{task="run_proactive_support_checks",status="failed"}[1h]))
          > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proactive support check job failed"
          description: "run_proactive_support_checks reported {{ $value }} failed run(s) in the last hour — check worker/cron logs and DLQ."

  # ── Adaptive Learning (Phase 5) ────────────────────────────────────────────
  # Metric contract M1–M5 (see devops/README.md): exported by the API / cron
  # process once the backend instruments them (AI-A). Empty series → no fires
  # until then.
  - name: adaptive-learning
    rules:
      - alert: AdaptiveQuizHighErrorRate
        expr: |
          rate(adaptive_quiz_submitted_total{passed="false"}[5m])
            / rate(adaptive_quiz_submitted_total[5m])
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Adaptive quiz error rate > 5%"
          description: "Adaptive quiz failure rate is {{ $value | humanizePercentage }} over the last 5 minutes — check adaptive question bank/difficulty."

      - alert: AdaptiveQuizSlowSubmit
        expr: histogram_quantile(0.95, rate(adaptive_quiz_submit_duration_seconds_bucket[5m])) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Adaptive quiz p95 submit latency > 3s"
          description: "Adaptive quiz submit p95 latency is {{ $value }}s over the last 5 minutes — grade_quiz may be slow (LLM re-generation or DB contention)."

      # Pod death is additionally covered by InstanceDown (up == 0) above.
      # The code records {status="failed"} on exception (tasks.py run_mastery_decay),
      # so this rule matches the real label value.
      - alert: MasteryDecayJobFailed
        expr: rate(adaptive_mastery_decay_runs_total{status="failed"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Mastery decay job failed"
          description: "run_mastery_decay reported {{ $value }} failed run(s) over the last 5 minutes — check worker/cron logs and DLQ."

  # ── Platform Intelligence + Retention (Phase 7) ────────────────────────────
  # Metric contract M8/M9 (see devops/README.md):
  #   M8 intelligence_snapshot_runs_total{status="success"|"error"}
  #        — instrumented by AI-A inside build_intelligence_snapshot
  #   M9 retention_cleanup_runs_total{collection,status="success"|"error"|"skipped"}
  #        — incremented by the 06:00 retention cron (run_retention_cleanup)
  # Empty series → no fires until the backend exports them.
  - name: intelligence-retention
    rules:
      - alert: IntelligenceSnapshotJobFailed
        expr: rate(intelligence_snapshot_runs_total{status="error"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Intelligence snapshot job failed"
          description: "build_intelligence_snapshot reported {{ $value }} failed run(s) over the last 5 minutes — check worker/cron logs and DLQ."

      - alert: RetentionCleanupJobFailed
        expr: rate(retention_cleanup_runs_total{status="error"}[5m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Retention cleanup job failed"
          description: "run_retention_cleanup reported {{ $value }} failed run(s) over the last 5 minutes — collections may be growing past their retention window."
