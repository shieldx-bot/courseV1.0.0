apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascendly-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: ascendly-worker
    app.kubernetes.io/instance: ascendly-worker
    app.kubernetes.io/component: worker
    {{- include "ascendly-runtime.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: ascendly-worker
  template:
    metadata:
      labels:
        app: ascendly-worker
        app.kubernetes.io/instance: ascendly-worker
        app.kubernetes.io/component: worker
        {{- include "ascendly-runtime.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      automountServiceAccountToken: false
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROCESS_MODE
              value: "worker"
          envFrom:
            - configMapRef:
                name: {{ .Values.configMapRef }}
            - secretRef:
                name: {{ .Values.secretRef }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 2"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: error-logs
              mountPath: /app/logs
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: error-logs
          emptyDir: {}
